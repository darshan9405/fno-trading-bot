name: fno-trading

# Single EC2 stack: backend (Flask) + ui (Streamlit) + nginx (localhost ingress)
# + cloudflared (Cloudflare Tunnel). Only cloudflared reaches the internet;
# nginx is bound to 127.0.0.1 and is not published.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/fno.db
      - BACKEND_URL=http://backend:8000
      - AUTO_SEED_INSTRUMENTS=1
      - TZ=Asia/Kolkata
    volumes:
      - fno-data:/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"   # local testing only; cloudflared is the only public path in prod
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ui
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]   # start with: docker compose --profile tunnel up
    # Image defaults to UID 65532, which cannot read ~/.cloudflared (700). Run
    # as root so it can read the mounted cert/credentials/config.
    user: "0"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  fno-data: