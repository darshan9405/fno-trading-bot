# Internal ingress. Binds all container interfaces: Docker publishes the port
# to 127.0.0.1 on the host (localhost-only), and cloudflared reaches it over
# the compose network. Cloudflare terminates TLS, so this server stays plain HTTP.
server {
    listen 80;
    server_name _;

    client_max_body_size 4m;
    gzip on;

    # Pass through Cloudflare's X-Forwarded-Proto (https) so Flask's ProxyFix
    # sees the real scheme.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Streamlit UI (including its WebSocket)
    location / {
        proxy_pass http://ui:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}